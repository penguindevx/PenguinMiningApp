<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Penguin Mining</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body { background: #0f172a; color: #fff; font-family: sans-serif; text-align: center; margin: 0; padding: 15px; }
    .card { background: #1e293b; padding: 16px; border-radius: 16px; margin-bottom: 15px; border: 1px solid #334155; }
    .btn { background: #2563eb; color: #fff; border: none; padding: 12px 20px; font-size: 15px; font-weight: bold; border-radius: 10px; width: 100%; cursor: pointer; margin-top: 10px; }
    .btn-danger { background: #dc2626; }
    .btn-success { background: #16a34a; }
    .stat { font-size: 24px; color: #38bdf8; font-weight: bold; }
    .vip-card { background: #0f172a; padding: 12px; margin: 10px 0; border-radius: 10px; border: 1px solid #0284c7; text-align: left; }
    .hidden { display: none; }
  </style>
</head>
<body>

  <h2>🐧 Penguin Mining</h2>

  <!-- ANA SAYFA -->
  <div id="page-home">
    <div class="card">
      <small>PENGUIN BAKİYESİ</small>
      <div id="balance" class="stat">0.0000</div>
      <small>Biriken: <span id="accumulated">0.000000</span> PENG</small>
      <button class="btn btn-success" onclick="claimTokens()">CLAIM</button>
    </div>

    <div class="card">
      <h3>⛏️ Mining</h3>
      <div id="status">🔴 Mining Kapalı</div>
      <div>⚡ Hız: <span id="speed">0.0001</span> PENG/sn</div>
      <div>💎 Paket: <span id="pkg-name">Ücretsiz</span></div>

      <button id="btn-start" class="btn" onclick="startMining()">⛏️ Start Mining</button>
      <button id="btn-stop" class="btn btn-danger hidden" onclick="stopMining()">🔴 Stop Mining</button>
    </div>

    <div style="display: flex; gap: 10px;">
      <button class="btn" onclick="showPage('vip')">💎 VIP Paketler</button>
      <button class="btn" onclick="showPage('profile')">👤 Profil</button>
    </div>
  </div>

  <!-- VIP SAYFASI -->
  <div id="page-vip" class="hidden">
    <button class="btn btn-danger" onclick="showPage('home')">← Geri</button>
    <div class="card">
      <h3>💎 VIP Mining Paketleri</h3>
      <div id="vip-list">Yükleniyor...</div>
    </div>
  </div>

  <!-- PROFİL SAYFASI -->
  <div id="page-profile" class="hidden">
    <button class="btn btn-danger" onclick="showPage('home')">← Geri</button>
    <div class="card">
      <h3>👤 Profilim</h3>
      <p>Kullanıcı: <b id="user-name">Penguin User</b></p>
      <p>ID: <b id="user-id">1987588383</b></p>
    </div>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    try { tg.expand(); } catch(e) {}

    let balance = parseFloat(localStorage.getItem('balance'));
    if (isNaN(balance)) balance = 0.0000;

    let accumulated = parseFloat(localStorage.getItem('accumulated'));
    if (isNaN(accumulated)) accumulated = 0.000000;

    let speed = 0.0001;
    let isMining = false;
    let timer = null;

    const user = (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) ? tg.initDataUnsafe.user : { id: "1987588383", first_name: "Penguin User" };
    document.getElementById('user-name').innerText = user.first_name || "Penguin User";
    document.getElementById('user-id').innerText = user.id || "1987588383";

    function updateDisplay() {
      document.getElementById('balance').innerText = Number(balance).toFixed(4);
      document.getElementById('accumulated').innerText = Number(accumulated).toFixed(6);
      document.getElementById('speed').innerText = Number(speed).toFixed(4);
    }

    function startMining() {
      if (isMining) return;
      isMining = true;
      document.getElementById('status').innerText = "🟢 Mining Aktif";
      document.getElementById('btn-start').classList.add('hidden');
      document.getElementById('btn-stop').classList.remove('hidden');

      timer = setInterval(() => {
        accumulated += speed;
        localStorage.setItem('accumulated', accumulated);
        updateDisplay();
      }, 1000);
    }

    function stopMining() {
      isMining = false;
      clearInterval(timer);
      document.getElementById('status').innerText = "🔴 Mining Kapalı";
      document.getElementById('btn-start').classList.remove('hidden');
      document.getElementById('btn-stop').classList.add('hidden');
    }

    function claimTokens() {
      balance += accumulated;
      accumulated = 0;
      localStorage.setItem('balance', balance);
      localStorage.setItem('accumulated', 0);
      updateDisplay();
    }

    function showPage(page) {
      document.getElementById('page-home').classList.add('hidden');
      document.getElementById('page-vip').classList.add('hidden');
      document.getElementById('page-profile').classList.add('hidden');

      if (page === 'vip') {
        document.getElementById('page-vip').classList.remove('hidden');
        loadVipPackages();
      } else if (page === 'profile') {
        document.getElementById('page-profile').classList.remove('hidden');
      } else {
        document.getElementById('page-home').classList.remove('hidden');
      }
    }

    async function loadVipPackages() {
      const container = document.getElementById('vip-list');
      try {
        const res = await fetch('/api/vip-packages');
        const data = await res.json();
        if (data.success && data.packages) {
          container.innerHTML = data.packages.map(p => `
            <div class="vip-card">
              <b>${p.name}</b><br>
              Fiyat: ${p.price}<br>
              Hız: ${p.speed} PENG/sn<br>
              <small style="word-break: break-all;">BNB Adresi: <code>${data.wallet}</code></small>
            </div>
          `).join('');
        }
      } catch (e) {
        container.innerHTML = `
          <div class="vip-card"><b>VIP 1 (Bronze)</b><br>Fiyat: 0.01 BNB<br>Hız: 0.005 PENG/sn</div>
          <div class="vip-card"><b>VIP 2 (Silver)</b><br>Fiyat: 0.05 BNB<br>Hız: 0.025 PENG/sn</div>
          <div class="vip-card"><b>VIP 3 (Gold)</b><br>Fiyat: 0.1 BNB<br>Hız: 0.08 PENG/sn</div>
        `;
      }
    }

    updateDisplay();
  </script>
</body>
</html>
